<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1c202c"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-192.png"><link rel="stylesheet" href="./style.css"><title>TVRemote</title></head><body><main class="app">
<section id="remoteView" class="view active"><div class="top-controls"><button class="device" data-sony="power"><span>TV</span><small>SONY BRAVIA<br>KDL-42W674A</small></button><button class="power" data-box="POWER"><span>⏻</span><small>ANDROID TV BOX</small></button><button class="device" data-sony="hdmi2"><span>⇥</span><small>HDMI 2</small></button></div>
<div class="dpad"><button class="up" data-box="UP">△</button><button class="left" data-box="LEFT">◁</button><button class="ok" data-box="OK">OK</button><button class="right" data-box="RIGHT">▷</button><button class="down" data-box="DOWN">▽</button></div>
<div class="middle"><button class="outline" data-box="BACK">←</button><button class="outline" data-box="EXIT">EXIT</button></div>
<div class="lower"><div class="volume"><button data-sony="volUp">＋</button><span>VOL</span><b>TV</b><button data-sony="volDown">－</button></div><div class="center"><button id="mic" class="mic">🎙</button><button class="outline mute" data-sony="mute">◀×</button></div><div class="volume"><button data-box="VOL+">＋</button><span>VOL</span><b>BOX</b><button data-box="VOL-">－</button></div></div>
<div id="voiceEntry" class="voice"><input id="query" placeholder="Nói hoặc nhập nội dung tìm kiếm"><button id="search">Tìm</button><p id="voiceStatus">Chạm micro để tìm kiếm bằng giọng nói</p></div></section>
<section id="keypadView" class="view"><h2>Bàn phím số</h2><div class="keys"><button data-box="1">1</button><button data-box="2">2</button><button data-box="3">3</button><button data-box="4">4</button><button data-box="5">5</button><button data-box="6">6</button><button data-box="7">7</button><button data-box="8">8</button><button data-box="9">9</button><button data-box="*">*</button><button data-box="0">0</button><button data-box="#">#</button></div></section>
<section id="settingsView" class="view settings"><h2>Cài đặt</h2><div class="field"><label>IP Sony BRAVIA</label><input id="sonyIp" value="192.168.1.234"></div><div class="field"><label>IP Android Box</label><input id="boxIp" value="192.168.1.233"></div><div class="field"><label>Sony PSK (nếu đã cấu hình)</label><input id="psk" type="password" placeholder="Để trống nếu không dùng"></div><div class="field"><label>Box HTTP Remote URL (nếu firmware có)</label><input id="boxApi" placeholder="Ví dụ http://192.168.1.233:8080"></div><div class="actions"><button id="save">Lưu cấu hình</button><button id="diag">Kiểm tra kết nối</button><button id="yt">Mở YouTube</button></div><div id="results" class="result">Chưa kiểm tra.</div><h3>Nhật ký</h3><button id="clear">Xóa nhật ký</button><div id="log"></div><p class="hint">Cấu hình lưu trên trình duyệt. PWA không thể tự quét LAN hoặc vượt CORS/HTTPS. Android Box chỉ điều khiển được nếu firmware có HTTP Remote API tương thích.</p></section>
<nav class="bottom"><button class="nav selected" data-view="remoteView">▢</button><button class="nav" data-view="keypadView">▦</button><button class="nav" data-view="settingsView">⚙</button></nav></main><div id="toast"></div><script src="./app.js"></script></body></html>
