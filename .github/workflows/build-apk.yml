name: build-apk
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - name: Chép giao diện web vào APK
        run: |
          mkdir -p android/app/src/main/assets/web
          cp -r index.html style.css app.js sw.js manifest.webmanifest icons android/app/src/main/assets/web/
      - run: gradle -p android assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk TVRemote.apk
      - uses: softprops/action-gh-release@v2
        with: { tag_name: apk-latest, name: TVRemote APK (mới nhất), files: TVRemote.apk }
